name: Build and Release
 
on:
  push:
    tags:
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 2.7.10.0)'
        required: false
        type: string
 
permissions:
  contents: write
 
env:
  BUILD_TYPE: Release
  FALLBACK_VERSION: "2.7.10.0"
 
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
 
    runs-on: windows-2022
    timeout-minutes: 90
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
 
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            packages
          key: nuget-${{ runner.os }}-${{ hashFiles('packages.config', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-
 
      - name: Derive version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            ver="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            ver="${{ github.ref_name }}"
          else
            ver="${{ env.FALLBACK_VERSION }}"
          fi
          # Pad to 4 parts
          IFS='.' read -ra PARTS <<< "$ver"
          while [[ ${#PARTS[@]} -lt 4 ]]; do
            ver="$ver.0"
            IFS='.' read -ra PARTS <<< "$ver"
          done
          echo "version=$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
 
      - name: Debug version
        run: echo "PACKAGE_VERSION=${{ steps.version.outputs.version }}"
 
      - name: Configure CMake
        run: |
          cmake . -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DTARGET_PLATFORM=${{ matrix.platform }} -DPACKAGE_VERSION=${{ steps.version.outputs.version }} -DSKIP_PACKAGE_SIGNING=true
 
      - name: Build
        run: cmake --build . --parallel
 
      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            bin/${{ matrix.platform }}/${{ env.BUILD_TYPE }}/wsl.msi
            bin/${{ matrix.platform }}/${{ env.BUILD_TYPE }}/init
            bin/${{ matrix.platform }}/${{ env.BUILD_TYPE }}/initrd.img
            bin/${{ matrix.platform }}/${{ env.BUILD_TYPE }}/installer.msix
          retention-days: 1
 
  bundle:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Derive version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            ver="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            ver="${{ github.ref_name }}"
          else
            ver="${{ env.FALLBACK_VERSION }}"
          fi
          IFS='.' read -ra PARTS <<< "$ver"
          while [[ ${#PARTS[@]} -lt 4 ]]; do
            ver="$ver.0"
            IFS='.' read -ra PARTS <<< "$ver"
          done
          echo "version=$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
 
      - name: Download x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-x64
          path: bin/x64/${{ env.BUILD_TYPE }}
 
      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-arm64
          path: bin/arm64/${{ env.BUILD_TYPE }}
 
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            packages
          key: nuget-${{ runner.os }}-${{ hashFiles('packages.config', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-
 
      - name: Configure CMake (bundle-only)
        run: |
          cmake . -DBUNDLE_ONLY=true -DPACKAGE_VERSION=${{ steps.version.outputs.version }} -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DSKIP_PACKAGE_SIGNING=true
 
      - name: Build bundle
        run: cmake --build . --target bundle
 
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: msixbundle
          path: bundle/${{ env.BUILD_TYPE }}/*.msixbundle
          retention-days: 1
 
  nupkg:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Derive version
        id: version
        shell: bash
        run: |
          if [[ -n "${{ inputs.version }}" ]]; then
            ver="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            ver="${{ github.ref_name }}"
          else
            ver="${{ env.FALLBACK_VERSION }}"
          fi
          IFS='.' read -ra PARTS <<< "$ver"
          while [[ ${#PARTS[@]} -lt 4 ]]; do
            ver="$ver.0"
            IFS='.' read -ra PARTS <<< "$ver"
          done
          echo "version=$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
 
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            packages
          key: nuget-${{ runner.os }}-${{ hashFiles('packages.config', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-
 
      - name: Configure CMake
        run: |
          cmake . -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DTARGET_PLATFORM=x64 -DPACKAGE_VERSION=${{ steps.version.outputs.version }} -DSKIP_PACKAGE_SIGNING=true
 
      - name: Build
        run: cmake --build . --parallel
 
      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: bin/**/*.nupkg
          retention-days: 1
 
  release:
    needs: [build, bundle, nupkg]
    runs-on: ubuntu-latest
    timeout-minutes: 10
 
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
 
      - name: Organize and rename
        run: |
          mkdir -p release
 
          cp artifacts/build-x64/wsl.msi        release/wsl-x64.msi
          cp artifacts/build-arm64/wsl.msi      release/wsl-arm64.msi
          cp artifacts/build-x64/init           release/init-x64
          cp artifacts/build-x64/initrd.img     release/initrd-x64.img
          cp artifacts/build-arm64/init         release/init-arm64
          cp artifacts/build-arm64/initrd.img   release/initrd-arm64.img
          cp artifacts/msixbundle/*.msixbundle  release/
          find artifacts/nupkg/ -name '*.nupkg' -exec cp {} release/ \;
 
          echo "=== Release files ==="
          ls -lh release/
 
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}