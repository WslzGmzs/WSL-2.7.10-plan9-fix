name: Build and Release
 
on:
  push:
    tags:
      - '[0-9]+.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version (e.g. 2.7.10.0)'
        required: false
        type: string
 
permissions:
  contents: write
 
env:
  BUILD_TYPE: Release
 
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, arm64]
 
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      WSL_PACKAGE_VERSION: ${{ inputs.version || github.ref_name || '2.7.10.0' }}
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Install ARM64 build tools
        if: matrix.platform == 'arm64'
        shell: pwsh
        run: |
          $vsPath = & "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS Path: $vsPath"
          & "$vsPath\Common7\Tools\VsDevCmd.bat" 2>$null
          # Install ARM64 cross-compiler workload
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\setup.exe"
          & $installer modify --installPath "$vsPath" `
            --add Microsoft.VisualStudio.Component.VC.Tools.ARM64 `
            --add Microsoft.VisualStudio.Component.VC.ATL.ARM64 `
            --passive --norestart --wait
          Write-Host "ARM64 tools installed"
 
      - name: Pad version to 4 parts
        id: version
        shell: bash
        run: |
          ver="${{ env.WSL_PACKAGE_VERSION }}"
          ver="${ver#v}"
          IFS='.' read -ra P <<< "$ver"
          while [[ ${#P[@]} -lt 4 ]]; do ver="$ver.0"; IFS='.' read -ra P <<< "$ver"; done
          echo "version=$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
 
      - name: Debug version
        run: |
          echo "RAW = ${{ env.WSL_PACKAGE_VERSION }}"
          echo "PADDED = ${{ steps.version.outputs.version }}"
 
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
 
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            packages
          key: nuget-${{ runner.os }}-${{ hashFiles('packages.config', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-
 
      - name: Configure CMake
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          PLATFORM_ARG=""
          if [ "${{ matrix.platform }}" = "arm64" ]; then
            PLATFORM_ARG="-A ARM64"
          elif [ "${{ matrix.platform }}" = "x64" ]; then
            PLATFORM_ARG="-A x64"
          fi
          echo "=== PACKAGE_VERSION=$VER ==="
          echo "=== PLATFORM_ARG=$PLATFORM_ARG ==="
          cmake . \
            -G "Visual Studio 17 2022" \
            $PLATFORM_ARG \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DTARGET_PLATFORM=${{ matrix.platform }} \
            -DPACKAGE_VERSION="$VER" \
            -DSKIP_PACKAGE_SIGNING=true
 
      - name: Build
        run: cmake --build . --config ${{ env.BUILD_TYPE }} --parallel
 
      - name: Upload platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.platform }}
          path: |
            bin/${{ matrix.platform }}/${{ env.BUILD_TYPE }}/wsl.msi
            bin/${{ matrix.platform }}/${{ env.BUILD_TYPE }}/init
            bin/${{ matrix.platform }}/${{ env.BUILD_TYPE }}/initrd.img
            bin/${{ matrix.platform }}/${{ env.BUILD_TYPE }}/installer.msix
          retention-days: 1
 
  bundle:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      WSL_PACKAGE_VERSION: ${{ inputs.version || github.ref_name || '2.7.10.0' }}
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Pad version to 4 parts
        id: version
        shell: bash
        run: |
          ver="${{ env.WSL_PACKAGE_VERSION }}"
          ver="${ver#v}"
          IFS='.' read -ra P <<< "$ver"
          while [[ ${#P[@]} -lt 4 ]]; do ver="$ver.0"; IFS='.' read -ra P <<< "$ver"; done
          echo "version=$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
 
      - name: Debug version
        run: echo "PACKAGE_VERSION = ${{ steps.version.outputs.version }}"
 
      - name: Download x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-x64
          path: bin/x64/${{ env.BUILD_TYPE }}
 
      - name: Download arm64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-arm64
          path: bin/arm64/${{ env.BUILD_TYPE }}
 
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            packages
          key: nuget-${{ runner.os }}-${{ hashFiles('packages.config', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-
 
      - name: Configure CMake (bundle-only)
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          echo "=== PACKAGE_VERSION=$VER ==="
          cmake . \
            -G "Visual Studio 17 2022" \
            -A x64 \
            -DBUNDLE_ONLY=true \
            -DPACKAGE_VERSION="$VER" \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DSKIP_PACKAGE_SIGNING=true
 
      - name: Build bundle
        run: cmake --build . --target bundle --config ${{ env.BUILD_TYPE }}
 
      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: msixbundle
          path: bundle/${{ env.BUILD_TYPE }}/*.msixbundle
          retention-days: 1
 
  nupkg:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      WSL_PACKAGE_VERSION: ${{ inputs.version || github.ref_name || '2.7.10.0' }}
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
 
      - name: Pad version to 4 parts
        id: version
        shell: bash
        run: |
          ver="${{ env.WSL_PACKAGE_VERSION }}"
          ver="${ver#v}"
          IFS='.' read -ra P <<< "$ver"
          while [[ ${#P[@]} -lt 4 ]]; do ver="$ver.0"; IFS='.' read -ra P <<< "$ver"; done
          echo "version=$ver"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
 
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            packages
          key: nuget-${{ runner.os }}-${{ hashFiles('packages.config', 'nuget.config') }}
          restore-keys: nuget-${{ runner.os }}-
 
      - name: Configure CMake
        shell: bash
        run: |
          VER="${{ steps.version.outputs.version }}"
          echo "=== PACKAGE_VERSION=$VER ==="
          cmake . \
            -G "Visual Studio 17 2022" \
            -A x64 \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DTARGET_PLATFORM=x64 \
            -DPACKAGE_VERSION="$VER" \
            -DSKIP_PACKAGE_SIGNING=true
 
      - name: Build
        run: cmake --build . --config ${{ env.BUILD_TYPE }} --parallel
 
      - name: Upload nupkg
        uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: bin/**/*.nupkg
          retention-days: 1
 
  release:
    needs: [build, bundle, nupkg]
    runs-on: ubuntu-latest
    timeout-minutes: 10
 
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
 
      - name: Organize and rename
        run: |
          mkdir -p release
 
          cp artifacts/build-x64/wsl.msi        release/wsl-x64.msi
          cp artifacts/build-arm64/wsl.msi      release/wsl-arm64.msi
          cp artifacts/build-x64/init           release/init-x64
          cp artifacts/build-x64/initrd.img     release/initrd-x64.img
          cp artifacts/build-arm64/init         release/init-arm64
          cp artifacts/build-arm64/initrd.img   release/initrd-arm64.img
          cp artifacts/msixbundle/*.msixbundle  release/
          find artifacts/nupkg/ -name '*.nupkg' -exec cp {} release/ \;
 
          echo "=== Release files ==="
          ls -lh release/
 
      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}